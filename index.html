<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<style>
:root{--bg:#0b0f19;--card:#141a28;--card2:#1b2335;--line:#26304a;--text:#e8ecf4;--muted:#8d98b0;--acc:#5fd3a0;--acc-ink:#062b1b;--blue:#5aa8f0;--red:#f06a6a;--yellow:#f2c14e;--r:14px;--shadow:0 8px 30px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f3f5f9;--card:#ffffff;--card2:#eef1f6;--line:#dde3ec;--text:#141a28;--muted:#5d6880;--acc:#1f9d68;--acc-ink:#ffffff;--blue:#2a7bd3;--red:#d64545;--yellow:#a87900;--shadow:0 8px 30px rgba(20,30,60,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
body{max-width:560px;margin:0 auto;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.top img{width:38px;height:38px;border-radius:10px}
.top .t{flex:1;min-width:0}
.top .brand{font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.3px}
.top h1{margin:0;font-size:18px;line-height:1.15}
.top .sub{font-size:11px;color:var(--muted)}
.iconbtn{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:17px}
.badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:700}
main{padding:12px 12px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.muted{color:var(--muted)}.small{font-size:12px}
.pos{color:var(--blue)}.neg{color:var(--red)}.warn{color:var(--yellow)}.ok{color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat .l{font-size:11px;color:var(--muted)}.stat .v{font-weight:700;font-size:15px;margin-top:2px}
.qa{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;font-size:12px}
.qa b{display:block;font-size:22px;margin-bottom:4px;font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;flex:none;font-size:16px}
.row .m{flex:1;min-width:0}
.row .m .a{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m .b{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row.click{cursor:pointer}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.bekliyor{color:var(--blue);border-color:var(--blue)}
.pill.kismi{color:var(--yellow);border-color:var(--yellow)}
.pill.odendi{color:var(--acc);border-color:var(--acc)}
.pill.gecikti{color:#fff;background:var(--red);border-color:var(--red)}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.primary,.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.block{width:100%;display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}

.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
label.f{display:block;margin-bottom:10px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;color:var(--text)}
label.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.calc{background:var(--card2);border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px;line-height:1.7}
.calc b{float:right}
.note{font-size:12px;color:var(--muted);background:var(--card2);border-left:3px solid var(--blue);padding:8px 10px;border-radius:6px;margin:8px 0}
.note.w{border-color:var(--yellow)}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:13px}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bottom button{background:transparent;border:0;border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.bottom button b{display:block;font-size:18px;font-weight:400}
nav.bottom button.on{background:var(--acc);color:var(--acc-ink)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--acc);color:var(--acc-ink);font-size:30px;box-shadow:var(--shadow);cursor:pointer;z-index:21}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-card{background:var(--card);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 14px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.sheet-head{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:10px;padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.sheet-head h3{flex:1;margin:0;font-size:17px}
@media(min-width:700px){.sheet{align-items:center}.sheet-card{border-radius:18px}}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{font-size:12px}
.bar .h{display:flex;justify-content:space-between;margin-bottom:3px}
.bar .t{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--red);border-radius:6px}
.bar .t i.g{background:var(--blue)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
video#cam{width:100%;border-radius:12px;background:#000;max-height:55vh;object-fit:cover}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:36px;cursor:pointer;display:block;margin:6px auto 12px}
.mic.rec{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.draft{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.hdr{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monthnav b{flex:1;text-align:center}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px;color:var(--text)}
#printArea{display:none}
@media print{body.print-mode>*:not(#printArea){display:none!important}body.print-mode #printArea{display:block!important;color:#000;background:#fff}body.print-mode{background:#fff;max-width:none}}
.pr{font-family:Arial,sans-serif;color:#000;padding:10px}
.pr table{width:100%;border-collapse:collapse;font-size:12px}
.pr th,.pr td{border:1px solid #999;padding:5px;text-align:right}
.pr th:nth-child(-n+2),.pr td:nth-child(-n+2){text-align:left}
.pr h1{font-size:18px;margin:0 0 4px}
</style>
</head>
<body>
<header class="top">
  <img src="icon.svg" alt="FOZ Defter">
  <div class="t"><div class="brand">FOZ Analytics</div><h1>FOZ Defter</h1><div class="sub">Ön Muhasebe · Test sürümü v0.2</div></div>
  <button class="iconbtn" data-act="openBell" title="Vadeler ve bildirimler">🔔<span class="badge" id="bellBadge" hidden>0</span></button>

<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   FOZ Defter - Ön Muhasebe  ·  v0.1 test sürümü
   FOZ Analytics · Created by Fatih Özdemiroğlu
   Tüm veriler cihazda (IndexedDB). Sunucu yok.
   ========================================================= */

const VERSION = '0.2.0';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const STATUS_LABEL = { bekliyor: 'Bekliyor', kismi: 'Kısmi Ödendi', odendi: 'Ödendi', gecikti: 'Gecikti' };
const PARTY_TYPES = { musteri: 'Müşteri', tedarikci: 'Tedarikçi', kisi: 'Kişi' };
const ACC_TYPES = { nakit: 'Nakit / Kasa', banka: 'Banka', kart: 'Kredi Kartı' };
const TX_TYPES = { gelir: 'Gelir', gider: 'Gider', transfer: 'Transfer', cekis: 'İşletmeden Çekilen' };
const TEVKIFAT = [['0','Yok'],['0.2','2/10'],['0.3','3/10'],['0.4','4/10'],['0.5','5/10'],['0.7','7/10'],['0.9','9/10'],['1','Tamamı']];
const DOC_TYPES = [['', '— Seçilmedi —'], ['efatura', 'e-Fatura'], ['earsiv', 'e-Arşiv fatura'], ['esmm', 'e-SMM'], ['fis', 'Fiş / ÖKC'], ['dekont', 'Banka dekontu'], ['diger', 'Diğer']];
const docLabel = (k) => (DOC_TYPES.find((x) => x[0] === k) || ['', ''])[1];
const TAX_KINDS = {
  kdv: { l: 'KDV', gider: false }, muhtasar: { l: 'Muhtasar ve prim hizmet', gider: false }, gecici: { l: 'Geçici vergi', gider: false },
  gelir: { l: 'Yıllık gelir vergisi', gider: false }, sgk: { l: 'SGK / Bağ-Kur primi', gider: true }, damga: { l: 'Damga vergisi', gider: true },
  mtv: { l: 'MTV', gider: true }, diger: { l: 'Diğer vergi / harç', gider: true },
};
const DEFAULT_KDV = { 'g-personel': 0, 'g-sgk': 0, 'g-vergi': 0, 'g-elektrik': 20, 'g-dogalgaz': 20, 'g-su': 10, 'g-internet': 20, 'g-telefon': 20, 'g-ofis': 20, 'g-yazilim': 20, 'g-ulasim': 20, 'g-temsil': 10, 'g-muhasebe': 20, 'g-gida': 10, 'i-hizmet': 20, 'i-danismanlik': 20, 'i-satis': 20 };
const FREQ = { monthly: 'Her ay', weekly: 'Her hafta', yearly: 'Her yıl' };
const CAL_URL = 'vergi-takvimi.json';

/* ---------- yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lower = (s) => String(s || '').toLocaleLowerCase('tr-TR');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = (v) => Math.round((Number(v) || 0) * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
const nf = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (v) => nf.format(r2(v)) + ' TL';
const numStr = (v) => (v === '' || v == null) ? '' : nf.format(r2(v));
function parseNum(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').trim(); let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/\s|TL|TRY|₺/gi, '');
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  if (s.startsWith('-')) { neg = true; s = s.slice(1); } else if (s.startsWith('+')) s = s.slice(1);
  if (!s) return 0;
  const c = s.lastIndexOf(','), d = s.lastIndexOf('.');
  if (c > -1 && d > -1) s = c > d ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (c > -1) s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const v = parseFloat(s);
  return isNaN(v) ? 0 : (neg ? -v : v);
}
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const fd = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return d + '.' + m + '.' + y; };
const ymOf = (s) => s.slice(0, 7);
function addMonths(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); }
const ymLabel = (ym) => AYLAR[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4);
const lastDay = (y, m) => new Date(y, m, 0).getDate();
function dueText(due) { const d = diffDays(due, today()); if (d > 0) return d + ' gün kaldı'; if (d === 0) return 'Bugün'; return (-d) + ' gün gecikti'; }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

/* ---------- depolama (IndexedDB) ---------- */
const DB = {
  db: null, ok: false, mem: { kv: {}, files: {} },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('foz-defter', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('files'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st);
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  async get(store, key) { if (!this.ok) return this.mem[store][key]; return this.req(store, 'readonly', (s) => s.get(key)); },
  async put(store, key, val) { if (!this.ok) { this.mem[store][key] = val; return; } return this.req(store, 'readwrite', (s) => s.put(val, key)); },
  async del(store, key) { if (!this.ok) { delete this.mem[store][key]; return; } return this.req(store, 'readwrite', (s) => s.delete(key)); },
  async keys(store) { if (!this.ok) return Object.keys(this.mem[store]); return this.req(store, 'readonly', (s) => s.getAllKeys()); },
  async clear(store) { if (!this.ok) { this.mem[store] = {}; return; } return this.req(store, 'readwrite', (s) => s.clear()); },
};

/* ---------- veri modeli ---------- */
function defaultState() {
  const st = {
    v: 2,
    settings: {
      firma: '', vkn: '', vergiDairesi: '',
      kdvDefault: 20, stopajRate: 20, stopajDefault: true,
      defaultAccount: 'a-banka', theme: 'dark', backupDays: 7,
      notif: { enabled: true, odeme: true, tahsilat: true, vergi: true, kart: true, days: [7, 3, 1, 0], hour: '09:00' },
      tax: { enabled: true, kdv: true, muhtasar: 'uc_aylik', gecici: true, yillik: true },
    },
    accounts: [
      { id: 'a-kasa', name: 'Kasa (Nakit)', type: 'nakit', opening: 0 },
      { id: 'a-banka', name: 'Banka', type: 'banka', opening: 0 },
    ],
    categories: {
      gider: [
        { id: 'g-kira', name: 'Kira ve Aidat' }, { id: 'g-personel', name: 'Personel' }, { id: 'g-sgk', name: 'SGK' },
        { id: 'g-vergi', name: 'Vergi ve Harç' }, { id: 'g-fatura', name: 'Faturalar' },
        { id: 'g-elektrik', name: 'Elektrik', parent: 'g-fatura' }, { id: 'g-dogalgaz', name: 'Doğalgaz', parent: 'g-fatura' },
        { id: 'g-su', name: 'Su', parent: 'g-fatura' }, { id: 'g-internet', name: 'İnternet', parent: 'g-fatura' },
        { id: 'g-telefon', name: 'Telefon', parent: 'g-fatura' },
        { id: 'g-ofis', name: 'Ofis ve Kırtasiye' }, { id: 'g-yazilim', name: 'Yazılım ve Abonelik' },
        { id: 'g-ulasim', name: 'Ulaşım ve Yakıt' }, { id: 'g-temsil', name: 'Temsil-Ağırlama' },
        { id: 'g-muhasebe', name: 'Muhasebe Ücreti' }, { id: 'g-gida', name: 'Mutfak ve Gıda' }, { id: 'g-diger', name: 'Diğer Gider' },
      ],

/* ---------- KDV / dönem hesapları ---------- */
function periodSums(period) {
  const s = { gelir: 0, gider: 0, gelirKdv: 0, giderKdv: 0, tevk: 0, stopaj: 0, cekis: 0, gelirTop: 0, giderTop: 0 };
  for (const t of S.tx) {
    if (!t.date.startsWith(period)) continue;
    if (t.type === 'gelir') { s.gelir += t.matrah; s.gelirKdv += t.kdv || 0; s.tevk += t.tevk || 0; s.stopaj += t.stopaj || 0; s.gelirTop += t.amount; }
    else if (t.type === 'gider') { s.gider += t.matrah; s.giderKdv += t.kdv || 0; s.giderTop += t.amount; }
    else if (t.type === 'cekis') s.cekis += t.amount;
  }
  for (const k in s) s[k] = r2(s[k]);
  s.net = r2(s.gelir - s.gider);
  return s;
}
function kdvTable(year) {
  const months = S.tx.map((t) => ymOf(t.date)).sort();
  let start = months[0] && months[0] < year + '-01' ? months[0] : year + '-01';
  let carry = 0; const rows = [];
  for (let ym = start; ym <= year + '-12'; ym = addMonths(ym, 1)) {
    const s = periodSums(ym); const hes = r2(s.gelirKdv - s.tevk);
    const pay = r2(Math.max(0, hes - s.giderKdv - carry));
    const next = r2(Math.max(0, s.giderKdv + carry - hes));
    if (ym.startsWith(year)) rows.push({ ym, hesaplanan: s.gelirKdv, tevk: s.tevk, indirilecek: s.giderKdv, devirGelen: carry, odenecek: pay, devreden: next });
    carry = next;
  }
  return rows;
}

/* ---------- akıllı içgörüler (kural tabanlı, cihazda) ---------- */
function insights() {
  const out = [], t = today();
  const late = S.debts.filter((d) => d.dir === 'alacak' && statusOf(d) === 'gecikti');
  if (late.length) out.push(['⚠️', `${late.length} gecikmiş alacağınız var, toplam ${money(late.reduce((a, d) => a + remOf(d), 0))}.`]);
  const lateB = S.debts.filter((d) => d.dir === 'borc' && statusOf(d) === 'gecikti');
  if (lateB.length) out.push(['⏰', `${lateB.length} ödemenizin vadesi geçti, toplam ${money(lateB.reduce((a, d) => a + remOf(d), 0))}.`]);
  for (const p of S.parties) {
    const open = S.debts.filter((d) => d.partyId === p.id && d.dir === 'alacak' && isOpen(d));
    if (!open.length) continue;
    const lastPay = S.debts.filter((d) => d.partyId === p.id && d.dir === 'alacak').flatMap((d) => d.payments.map((x) => x.date)).sort().slice(-1)[0];
    const ref = lastPay || open.map((d) => d.date).sort()[0];
    const days = diffDays(t, ref);
    if (days >= 45) out.push(['🕑', `${p.name} firmasından ${days} gündür tahsilat yok.`]);
  }
  const cur = ymOf(t), prev = addMonths(cur, -1); const byCat = (ym) => { const m = {}; for (const x of S.tx) if (x.type === 'gider' && x.date.startsWith(ym)) { const c = topCat(x.categoryId) || 'diger'; m[c] = (m[c] || 0) + x.matrah; } return m; };
  const a = byCat(cur), b = byCat(prev);
  for (const c in a) if (b[c] > 0 && a[c] >= 500) { const ch = Math.round((a[c] - b[c]) / b[c] * 100); if (ch >= 30) out.push(['📈', `Bu ay ${catName(c)} giderleriniz geçen aya göre %${ch} arttı.`]); }
  const lim = addDays(t, 30); let inc = 0, outg = 0;
  for (const d of S.debts) if (isOpen(d) && d.due && d.due >= t && d.due <= lim) d.dir === 'alacak' ? (inc += remOf(d)) : (outg += remOf(d));
  if (inc || outg) out.push(['💧', `Önümüzdeki 30 günde beklenen tahsilat ${money(inc)}, yapılacak ödeme ${money(outg)}.`]);
  const kd = kdvTable(t.slice(0, 4)).find((r) => r.ym === cur);
  if (kd && kd.odenecek > 0) out.push(['🧾', `Bu ayın tahmini ödenecek KDV'si ${money(kd.odenecek)} (bilgi amaçlı).`]);
  return out.slice(0, 6);
}

function createFromRule(r, date) {
  const k = Number(r.kdvRate) || 0; const matrah = r2(r.amount / (1 + k / 100));
  const tx = { id: uid(), created: Date.now(), type: r.type, date, amount: r.amount, matrah, kdv: r2(r.amount - matrah), kdvRate: k, categoryId: r.categoryId, accountId: r.accountId, partyId: r.partyId || null, desc: r.desc, docType: r.docType || null, source: 'tekrar', recurringId: r.id };
  if (r.type === 'gelir' && (r.tevkifat || r.stopajRate)) { tx.tevkifat = r.tevkifat; tx.stopajRate = r.stopajRate; tx.tevk = r2(tx.kdv * r.tevkifat); tx.stopaj = r2(matrah * r.stopajRate / 100); tx.cash = r2(tx.amount - tx.tevk - tx.stopaj); }
  if (r.pay === 'vadeli' && r.partyId) { tx.accountId = null; S.debts.push({ id: uid(), dir: r.type === 'gelir' ? 'alacak' : 'borc', partyId: r.partyId, amount: tx.cash ?? tx.amount, date, due: addDays(date, r.dueDays || 30), desc: r.desc || catName(r.categoryId), payments: [], linkedTxId: tx.id, remind: null }); }
  S.tx.push(tx);
}
function runRecurring() {
  const t = today(); let n = 0;
  for (const r of S.recurring) {
    if (!r.active) continue; let guard = 0; let nx = nextOcc(r, r.last);
    while (nx <= t && (!r.end || nx <= r.end) && guard++ < 400) { createFromRule(r, nx); r.last = nx; n++; nx = nextOcc(r, nx); }
  }
  if (n) { save(); toast('🔁 ' + n + ' tekrarlayan işlem eklendi'); render(); }
}

    <div class="small muted" style="margin-bottom:10px">Değişiklikler sonraki tekrarlara uygulanır; daha önce eklenen işlemler değişmez.</div>

  });

function esmmCalc(o) {
  const s = o.stopajOn ? o.stopajRate / 100 : 0, k = o.kdvRate / 100, t = o.tevk;

  brut = r2(brut); const stopaj = r2(brut * s), kdv = r2(brut * k), tevk = r2(kdv * t);
  return { brut, stopaj, kdv, tevk, net: r2(brut - stopaj + kdv - tevk) };
}

const CAT_KEYS = [

  [/su faturası|\bsu parası|iski|aski|izsu/, 'g-su'], [/internet|superonline|türknet|turknet|fiber/, 'g-internet'],
  [/telefon|turkcell|vodafone|türk telekom|hat faturası|gsm/, 'g-telefon'], [/kira|aidat/, 'g-kira'],
  [/maaş|personel|avans/, 'g-personel'], [/sgk|bağkur|bağ-kur|sigorta primi/, 'g-sgk'],
  [/vergi|harç|kdv ödemesi|muhtasar|mtv/, 'g-vergi'],
  [/benzin|mazot|motorin|akaryakıt|yakıt|otopark|taksi|uber|köprü|otoyol|hgs|ogs|bilet|uçak|otobüs|ulaşım/, 'g-ulasim'],
  [/yazılım|abonelik|adobe|microsoft|office|workspace|chatgpt|claude|hosting|domain|lisans/, 'g-yazilim'],
  [/kırtasiye|ofis|toner|kağıt|yazıcı|bilgisayar|laptop|mobilya/, 'g-ofis'],
  [/restoran|yemek|kahve|cafe|kafe|ağırlama|ikram/, 'g-temsil'], [/muhasebe|mali müşavir|smmm/, 'g-muhasebe'],
  [/market|migros|bim|a101|a 101|şok|carrefour|gıda|manav|fırın|ekmek/, 'g-gida'],
];
const GELIR_KEYS = [[/danışmanlık/, 'i-danismanlik'], [/kira geliri|kira aldım|kirayı aldım|kira tahsil/, 'i-kira'], [/satış|sattım/, 'i-satis'], [/hizmet|hakediş|proje|eğitim/, 'i-hizmet']];
const AY_RE = 'ocak|şubat|mart|nisan|mayıs|haziran|temmuz|ağustos|eylül|ekim|kasım|aralık';
function findAmount(t) {
  const re = /(\d{1,3}(?:[.\s]\d{3})+|\d+)(?:,(\d{1,2}))?\s*(bin|milyon)?\s*(tl\b|lira|₺|dolar|usd|euro|eur\b|avro)?/g;
  let best = null, m;
  while ((m = re.exec(t))) {
    let v = parseFloat(m[1].replace(/[.\s]/g, '') + (m[2] ? '.' + m[2] : '')); if (m[3] === 'bin') v *= 1000; if (m[3] === 'milyon') v *= 1e6;
    const after = t.slice(m.index + m[0].length, m.index + m[0].length + 12), before = t.slice(Math.max(0, m.index - 1), m.index);
    if (!m[4] && !m[3] && (new RegExp('^\\s*(' + AY_RE + ')').test(after) || /^[./]\d/.test(after) || /[./]$/.test(before) || /^\s*gün/.test(after))) continue;
    const score = (m[4] ? 2 : 0) + (m[3] ? 1 : 0);
    if (!best || score > best.score) best = { v: r2(v), score, cur: m[4] || '' };
  }
  return best;
}
function findDates(t) {
  const out = []; const base = today(); let m;
  const rel = [[/\bbugün\b/, 0], [/\bdün\b/, -1], [/önceki gün|evvelsi gün/, -2], [/\byarın\b/, 1]];
  for (const [re, n] of rel) { const x = t.match(re); if (x) out.push({ d: addDays(base, n), i: x.index }); }
  const reM = new RegExp('(\\d{1,2})\\s+(' + AY_RE + ')(?:\\s+(\\d{4}))?', 'g');
  while ((m = reM.exec(t))) { const mi = AY_RE.split('|').indexOf(m[2]) + 1; let y = m[3] ? Number(m[3]) : Number(base.slice(0, 4)); out.push({ d: y + '-' + pad(mi) + '-' + pad(m[1]), i: m.index }); }
  const reN = /(\d{1,2})[./](\d{1,2})[./](\d{2,4})/g;
  while ((m = reN.exec(t))) { let y = Number(m[3]); if (y < 100) y += 2000; out.push({ d: y + '-' + pad(m[2]) + '-' + pad(m[1]), i: m.index }); }
  return out.sort((a, b) => a.i - b.i);
}
const titleTR = (s) => s.split(/\s+/).map((w) => w ? w[0].toLocaleUpperCase('tr-TR') + w.slice(1) : w).join(' ');
function findParty(t) {
  let best = null;
  for (const p of S.parties) {
    const n = lower(p.name); const first = n.split(/\s+/)[0];
    if (n.length >= 3 && t.includes(n)) return { id: p.id };
    if (first.length >= 3 && new RegExp('(^|\\s)' + first.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t)) best = best || { id: p.id };
  }
  if (best) return best;
  const m = t.match(/([a-zçğıöşü0-9&.]+(?:\s[a-zçğıöşü0-9&.]+)?)\s+(?:firmasından|firmasına|firmasının|firması|şirketinden|şirketine|beyden|beye|hanımdan|hanıma)/);
  if (m) return { newName: titleTR(m[1]) };

}
function parseCommand(text) {
  const parts = text.split(/[;\n]|,\s+|\s+ve\s+|\.\s+/).map((x) => x.trim()).filter(Boolean);
  const merged = [];
  let carry = '';
  for (const p of parts) { if (findAmount(lower(p))) { merged.push((carry + ' ' + p).trim()); carry = ''; } else if (merged.length) merged[merged.length - 1] += ' ' + p; else carry += ' ' + p; }
  const drafts = [];
  for (const raw of merged) {
    const t = lower(raw); const am = findAmount(t); if (!am) continue;
    const dates = findDates(t); const hasVade = /vade|son ödeme|ödeme tarihi|e kadar|a kadar|ye kadar|ya kadar/.test(t);
    let date = today(), due = null;
    if (dates.length) { if (hasVade) { due = dates[dates.length - 1].d; if (dates.length > 1) date = dates[0].d; } else date = dates[0].d; }
    const pt = findParty(t);
    let kind;
    if (/borç verdim|ödünç verdim|borç olarak verdim|alacağım var|alacaklıyım/.test(t)) kind = 'alacak';
    else if (/borç aldım|ödünç aldım|borçlandım|borcum var|borcum|borçluyum/.test(t)) kind = 'borc';
    else if (/tahsil|ödeme aldım|para aldım|ücret aldım|hakediş|yatırdı|gönderdi|havale geldi|eft geldi|kazandım|gelir|sattım|satış yaptım|fatura kestim|makbuz kestim|kirayı aldım|kira aldım/.test(t) || /(firmasından|şirketinden|müşteriden)\s.*aldım/.test(t) || (pt && pt.id && party(pt.id).type === 'musteri' && /aldım/.test(t))) kind = 'gelir';
    else kind = 'gider';

    let categoryId = null;
    if (kind === 'gelir') { categoryId = 'i-hizmet'; for (const [re, id] of GELIR_KEYS) if (re.test(t)) { categoryId = id; break; } }
    if (kind === 'gider') { categoryId = 'g-diger'; for (const [re, id] of CAT_KEYS) if (re.test(t)) { categoryId = id; break; } }
    let debtId = null;
    if ((kind === 'gelir' || kind === 'gider') && pt && pt.id) {
      const dir = kind === 'gelir' ? 'alacak' : 'borc';
      const od = S.debts.filter((d) => d.partyId === pt.id && d.dir === dir && isOpen(d)).sort((a, b) => a.due.localeCompare(b.due))[0];
      if (od) { kind = 'payment'; debtId = od.id; }
    }
    drafts.push({ kind, amount: am.v, cur: am.cur, date, due: due || addDays(date, 30), categoryId, kdvRate: categoryId ? catKdv(categoryId) : 0, partyId: pt && pt.id ? pt.id : (pt && pt.newName ? '__new' : ''), newName: pt && pt.newName ? pt.newName : '', debtId, desc: raw });
  }

}

async function showNotif(title, body, tag, data) {

}
async function checkNotifs() {
  const n = S.settings.notif; if (!n.enabled || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date(); const [hh, mm] = (n.hour || '09:00').split(':').map(Number);
  if (now.getHours() * 60 + now.getMinutes() < hh * 60 + mm) return;
  const t = today(); let changed = false;
  const fire = async (key, title, body, data) => { if (S.notifLog[key]) return; S.notifLog[key] = t; changed = true; await showNotif(title, body, key, data); };
  for (const d of S.debts) {
    if (!isOpen(d) || !d.due) continue;
    if ((d.dir === 'borc' && !n.odeme) || (d.dir === 'alacak' && !n.tahsilat)) continue;
    const name = debtTitle(d), amt = money(remOf(d)), dd = diffDays(d.due, t);
    if (d.snooze) { if (d.snooze > t) continue; if (d.snooze === t) { await fire(d.id + '|snz' + t, (d.dir === 'borc' ? 'Ödeme hatırlatması: ' : 'Tahsilat hatırlatması: ') + name, `${amt} · vade ${fd(d.due)} (${dueText(d.due)})`, { debtId: d.id }); continue; } }
    const offs = d.remind || n.days;
    if (dd >= 0 && offs.includes(dd)) await fire(d.id + '|' + dd, (d.dir === 'borc' ? '🔔 Ödeme hatırlatması: ' : '🔔 Tahsilat hatırlatması: ') + name, `${amt} · vade ${fd(d.due)} · ${dueText(d.due)}`, { debtId: d.id });
    else if (dd < 0) await fire(d.id + '|late' + Math.floor((-dd - 1) / 7), (d.dir === 'borc' ? '⚠️ Ödeme gecikti: ' : '⚠️ Tahsilat gecikti: ') + name, `${amt} · vade ${fd(d.due)} · ${dueText(d.due)}`, { debtId: d.id });
  }
  if (n.kart) { const bal = balances(); for (const a of S.accounts) if (a.type === 'kart') { const due = nextCardDue(a); const owe = -(bal[a.id] || 0); if (!due || owe <= 0.009) continue; const dd = diffDays(due, t); if (n.days.includes(dd)) await fire('card|' + a.id + '|' + due + '|' + dd, '💳 Kart son ödeme: ' + a.name, `${money(owe)} · son ödeme ${fd(due)} (${dueText(due)})`); } }
  if (n.vergi) for (const e of taxEvents(t, addDays(t, 3))) { const dd = diffDays(e.due, t); if ([3, 1, 0].includes(dd)) await fire(e.id + '|' + dd, '🧾 ' + e.title, `Son gün ${fd(e.due)} (${dueText(e.due)}). Mali müşavirinizle teyit edin.`); }
  const bd = backupDue(); if (bd) await fire('backup|' + (S.lastBackup || 'never') + '|' + Math.floor((bd === Infinity ? 0 : bd) / Math.max(1, S.settings.backupDays)), '💾 Yedek alma zamanı', bd === Infinity ? 'Henüz hiç yedek almadınız. Ayarlar → Yedek al.' : `Son yedek ${bd} gün önce. Verilerinizi korumak için yedek alın.`);
  for (const a of activeAnns()) await fire('ann|' + a.id, '📢 ' + (a.baslik || 'FOZ Defter'), a.mesaj || '');
  if (changed) save();
}

function barChartSVG(labels, series) {

    g += `<text x="${(pl + i * gw + gw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">${esc(labels[i])}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}<line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="currentColor" opacity=".15"/></svg>
  <div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

    ${[['newTx', 'gider', '↑', 'Gider'], ['newTx', 'gelir', '↓', 'Gelir'], ['newEsmm', '', '🧾', 'e-SMM'], ['newDebt', '', '🤝', 'Borç / Alacak'], ['newTax', '', '🏛️', 'Vergi / SGK ödemesi'], ['scanQR', '', '⌗', 'QR okut (e-Fatura)'], ['scanReceipt', '', '📷', 'Fiş fotoğrafı'], ['voice', '', '🎙️', 'Sesli / yazılı kayıt'], ['newTx', 'transfer', '⇄', 'Transfer / kart ödemesi'], ['newTx', 'cekis', '↗', 'İşletmeden çekilen'], ['newParty', '', '🏢', 'Yeni cari']].map(([a, t, i, l]) => `<div class="qa" data-act="${a}" data-type="${t}"><b>${i}</b>${l}</div>`).join('')}</div>`),
  newTx: (d) => txForm({ type: d.type || 'gider' }),
  editTx: (d) => txForm({}, d.id),
  newDebt: (d) => debtForm(d.party ? { partyId: d.party, dir: (party(d.party) || {}).type === 'musteri' ? 'alacak' : 'borc' } : {}),
  editDebt: (d) => { const x = debt(d.id); if (x && x.tax) taxForm({}, d.id); else debtForm({}, d.id); },
  newTax: () => taxForm(),
  taxFromCal: (d) => taxForm({ kind: d.tk === 'gelir2' ? 'gelir' : d.tk, donem: d.donem || addMonths(ymOf(today()), -1), due: d.due }),
  recForm: (d) => recForm(d.id),
  importData: () => importData(),
  backupSnooze: () => { S.backupSnooze = addDays(today(), 3); save(); render(); toast('3 gün sonra hatırlatılacak'); },
  dismissAnn: (d) => { S.seenAnn[d.id] = true; save(); render(); },
  debtDetail: (d, el, e) => { if (e.target.closest('[data-act="pay"]')) return; debtDetail(d.id); },
  pay: (d, el, e) => { e.stopPropagation(); payForm(d.id); },
  delPay: async (d) => { const x = debt(d.debt); if (!x) return; if (await askConfirm('Bu ödeme silinsin mi?', 'Sil')) { const p = x.payments.find((y) => y.id === d.id); if (p && p.txId) S.tx = S.tx.filter((t) => t.id !== p.txId); x.payments = x.payments.filter((y) => y.id !== d.id); save(); render(); } debtDetail(x.id); },
  newParty: () => partyForm(), editParty: (d) => partyForm(d.id), partyDetail: (d) => partyDetail(d.id),
  ekstre: (d) => showEkstre(d.id),
  printEkstre: (d) => { $('#printArea').innerHTML = ekstreHTML(d.id); document.body.classList.add('print-mode'); setTimeout(() => { try { window.print(); } catch (e) { toast('Yazdırma bu ortamda açılamadı; HTML indirin'); } }, 50); },
  dlEkstre: (d) => download(new Blob([`<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><title>Cari Ekstre</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:6px;text-align:right}th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}</style></head><body>${ekstreHTML(d.id)}</body></html>`], { type: 'text/html' }), `Cari-Ekstre-${(partyName(d.id) || 'cari').replace(/[^\wçğıöşüÇĞİÖŞÜ]+/g, '_')}-${today()}.html`),
  newEsmm: () => esmmForm(), esmmDetail: (d) => esmmDetail(d.id),
  delEsmm: async (d) => { const e = S.esmm.find((x) => x.id === d.id); if (!e) return; const dl = S.debts.find((x) => x.linkedTxId === e.txId); if (dl && dl.payments.length) { toast('Tahsilatı olan e-SMM silinemez; önce tahsilatı silin'); return; } if (await askConfirm('e-SMM kaydı ve bağlı gelir silinsin mi?', 'Sil')) { S.esmm = S.esmm.filter((x) => x !== e); S.tx = S.tx.filter((t) => t.id !== e.txId); S.debts = S.debts.filter((x) => x.linkedTxId !== e.txId); save(); render(); toast('Silindi'); } else esmmDetail(e.id); },
  scanQR: () => openScanner(), qrFromImage: () => qrFromImage(), scanReceipt: () => scanReceipt(), voice: () => openVoice(),
  viewPhoto: async (d) => { const u = await photoURL(d.id); if (u) { const w = document.createElement('div'); w.className = 'sheet'; w.style.zIndex = 70; w.innerHTML = `<img src="${u}" style="max-width:96vw;max-height:90vh;border-radius:12px;margin:auto">`; w.onclick = () => w.remove(); document.body.appendChild(w); } },
  openBell: () => { const ag = agenda(60); const late = ag.filter((x) => x.due < today()), soon = ag.filter((x) => x.due >= today()); openSheet('Vadeler ve hatırlatmalar', `${late.length ? `<div class="hdr">Geciken</div>${late.map(agendaRow).join('')}` : ''}<div class="hdr">Önümüzdeki 60 gün</div>${soon.length ? soon.map(agendaRow).join('') : '<div class="empty">Yaklaşan vade yok</div>'}<button class="btn block" style="margin-top:12px" data-act="tab" data-tab="settings">Bildirim ayarları</button>`); },
  cardPay: (d) => { const a = acc(d.id); const bank = S.accounts.find((x) => x.type === 'banka') || S.accounts[0]; txForm({ type: 'transfer', amount: Math.max(0, -balances()[a.id]), accountId: bank.id, toAccountId: a.id, desc: a.name + ' ödemesi' }); },
  txMonth: (d) => { UI.txMonth = addMonths(UI.txMonth, Number(d.n)); render(); },
  txFilter: (d) => { UI.txFilter = d.v; render(); },
  cariTab: (d) => { UI.cariTab = d.v; render(); }, debtFilter: (d) => { UI.debtFilter = d.v; render(); },
  repMode: (d) => { UI.repMode = d.v; render(); },
  repNav: (d) => { if (UI.repMode === 'ay') UI.repMonth = addMonths(UI.repMonth, Number(d.n)); else UI.repYear = String(Number(UI.repYear) + Number(d.n)); render(); },
  exportXlsx: () => { const x = xlsxBlob(); download(x.blob, x.name); toast('Excel indirildi'); },
  shareXlsx: () => { const x = xlsxBlob(); shareFile(x.blob, x.name, 'FOZ Defter muhasebeci paketi'); },
  exportZip: () => exportZip(), exportCsv: () => exportCsv(),
  askNotif: () => askNotifPermission(),
  testNotif: async () => { if (!('Notification' in window) || Notification.permission !== 'granted') { toast('Önce bildirim izni verin'); return; } const ok = await showNotif('🔔 FOZ Defter test bildirimi', 'Vade bildirimleri bu şekilde görünecek.', 'test-' + Date.now()); toast(ok ? 'Test bildirimi gönderildi' : 'Bildirim gösterilemedi'); },
  newAcc: () => accForm(), editAcc: (d) => accForm(d.id), newCat: () => catForm(),
  catMenu: (d) => catEditForm(d.id),
  catMenuOld: async (d) => { const c = cat(d.id); if (!c.custom) { toast('Hazır kategoriler silinemez'); return; } if (S.tx.some((t) => t.categoryId === c.id)) { toast('Bu kategoride işlem var'); return; } if (await askConfirm(c.name + ' kategorisi silinsin mi?', 'Sil')) { for (const k of ['gider', 'gelir']) S.categories[k] = S.categories[k].filter((x) => x.id !== c.id && x.parent !== c.id); save(); render(); } },
  backup: () => makeBackup(null),
  backupEnc: async () => { const pw = await askText('Şifreli yedek', 'Yedek şifresi (unutmayın, kurtarılamaz)', 'password'); if (pw && pw.length >= 4) makeBackup(pw); else toast('En az 4 karakter'); },
  restore: () => { const i = $('#jsonPick'); i.value = ''; i.onchange = () => i.files[0] && restoreBackup(i.files[0]); i.click(); },
  loadSample: async () => { if (S.tx.length || S.debts.length) { if (!(await askConfirm('Mevcut veriler silinip örnek veriler yüklensin mi?', 'Yükle'))) return; } await DB.clear('files'); loadSample(); },
  resetAll: async () => { if (await askConfirm('TÜM veriler silinsin mi? Bu işlem geri alınamaz.', 'Hepsini sil')) { const th = S.settings.theme; S = defaultState(); S.settings.theme = th; await DB.clear('files'); await flush(); render(); toast('Veriler silindi'); } },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) { if (e.target.id === 'sheet') closeSheet(); return; }
  const fn = ACT[el.dataset.act]; if (fn) { if (el.closest('#sheet') && !['pay', 'closeSheet', 'viewPhoto', 'printEkstre', 'dlEkstre', 'delPay', 'qrFromImage'].includes(el.dataset.act)) closeSheet(); fn(el.dataset, el, e); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').classList.contains('hidden')) closeSheet(); });
window.addEventListener('afterprint', () => document.body.classList.remove('print-mode'));
document.addEventListener('input', (e) => {
  if (e.target.id === 'txSearch') { UI.txSearch = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#txSearch'); n.focus(); n.setSelectionRange(pos, pos); }
  if (e.target.id === 'cariSearch') { UI.cariSearch = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#cariSearch'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'bdaysSel') { S.settings.backupDays = Number(e.target.value); save(); toast('Kaydedildi'); } });
document.addEventListener('submit', (e) => {
  const f = e.target;
  if (f.id === 'firmF') { e.preventDefault(); const st = S.settings; st.firma = f.firma.value.trim(); st.vkn = f.vkn.value.trim(); st.vergiDairesi = f.vergiDairesi.value.trim(); st.kdvDefault = Number(f.kdvDefault.value); st.stopajRate = parseNum(f.stopajRate.value); st.stopajDefault = f.stopajDefault.checked; st.defaultAccount = f.defaultAccount.value; save(); toast('Kaydedildi'); render(); }
  if (f.id === 'notifF') { e.preventDefault(); const n = S.settings.notif; ['enabled', 'odeme', 'tahsilat', 'kart', 'vergi'].forEach((k) => (n[k] = f[k].checked)); n.days = $$('input[name=days]:checked', f).map((x) => Number(x.value)); n.hour = f.hour.value || '09:00'; save(); toast('Kaydedildi'); checkNotifs(); }
  if (f.id === 'taxF') { e.preventDefault(); const t = S.settings.tax; ['enabled', 'kdv', 'gecici', 'yillik'].forEach((k) => (t[k] = f[k].checked)); t.muhtasar = f.muhtasar.value; save(); toast('Kaydedildi'); render(); }
});

/* ---------- render ---------- */
function applyTheme() { document.documentElement.dataset.theme = S.settings.theme || 'dark'; $('meta[name=theme-color]').content = S.settings.theme === 'light' ? '#f3f5f9' : '#0b0f19'; }
function render() {
  const v = { home: viewHome, tx: viewTx, cari: viewCari, report: viewReport, settings: viewSettings }[UI.tab] || viewHome;
  $('#view').innerHTML = v();
  $$('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === UI.tab));
  const t = today(); const cnt = agenda(7).filter((x) => x.kind !== 'rec' && (x.kind !== 'tax' || x.due <= addDays(t, 3))).length;
  const bb = $('#bellBadge'); bb.hidden = !cnt; bb.textContent = cnt;
}
function handleUrlAction(urlStr) {
  try {
    const u = new URL(urlStr, location.href); const a = u.searchParams.get('action'), id = u.searchParams.get('debt');
    if (!a || !id || !debt(id)) return;
    if (a === 'paid') payForm(id); else if (a === 'snooze') { debt(id).snooze = addDays(today(), 1); save(); toast('Yarın tekrar hatırlatılacak'); } else debtDetail(id);
    history.replaceState(null, '', location.pathname);
  } catch (e) { }
}

/* ---------- açılış ---------- */
(async function init() {
  await DB.open();
  try { const st = await DB.get('kv', 'state'); if (st) S = mergeDefaults(st); } catch (e) { }
  if (!DB.ok) setTimeout(() => toast('⚠️ Tarayıcı depolaması kullanılamıyor; veriler sayfa kapanınca kaybolur. Yedek alın.'), 800);
  applyTheme(); render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  runRecurring();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    const hadCtrl = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && !reloading) { reloading = true; flush().then(() => location.reload()); } });
    try { const reg = await navigator.serviceWorker.register('sw.js'); reg.update().catch(() => {}); } catch (e) { }
    navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'notif-action') handleUrlAction(e.data.url); });
  }
  handleUrlAction(location.href);
  checkNotifs(); setInterval(checkNotifs, 60000); fetchTaxCal(); setInterval(() => { runRecurring(); fetchTaxCal(); }, 3600000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else { runRecurring(); render(); checkNotifs(); fetchTaxCal(); } });
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (UI.tab === 'settings') render(); });
})();
</script>
</body>
